name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  julia:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        julia: ['1.13']
        threads: ['1', 'auto']
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-runtest@v1
  opencv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: julia-actions/cache@v3
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - run: python -m pip install -r validation/requirements.txt
      - run: python -m unittest discover -s validation -p 'test_*.py'
      - run: python -O -m unittest discover -s validation -p 'test_*.py'
      - run: python validation/validate.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: opencv-reference-results
          path: validation/latest-results.json
