name: Tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  julia:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            julia: '1.13'
            threads: '1'
          - os: ubuntu-24.04
            julia: '1.13'
            threads: 'auto'
          - os: macos-latest
            julia: '1.13'
            threads: 'auto'
          - os: windows-latest
            julia: '1.13'
            threads: 'auto'
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-runtest@v1
      - name: Run standalone examples
        if: matrix.os == 'ubuntu-24.04' && matrix.threads == 'auto'
        run: julia --startup-file=no --project=. --threads=auto examples/run_all.jl
      - name: Verify single-thread vs multi-thread bitwise determinism
        if: matrix.os == 'ubuntu-24.04' && matrix.threads == 'auto'
        shell: bash
        run: |
          T1=$(julia --startup-file=no --project=. -t 1 -e 'using SIFTFeatures; include("test/fixtures.jl"); a = fixture(256, 256); k, d = sift(a); m = match_descriptors(d, d; crosscheck=true); println(length(k), " ", hash(d), " ", [(t.query, t.train, t.distance) for t in m] |> hash)')
          TA=$(julia --startup-file=no --project=. -t auto -e 'using SIFTFeatures; include("test/fixtures.jl"); a = fixture(256, 256); k, d = sift(a); m = match_descriptors(d, d; crosscheck=true); println(length(k), " ", hash(d), " ", [(t.query, t.train, t.distance) for t in m] |> hash)')
          echo "1-thread:    $T1"
          echo "auto-thread: $TA"
          test "$T1" = "$TA"
