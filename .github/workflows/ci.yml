name: Tests
on: [push, pull_request]
permissions:
  contents: write
jobs:
  julia:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        julia: ['1.13']
        threads: ['1', 'auto']
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-runtest@v1
  opencv:
    needs: julia
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: julia-actions/cache@v3
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - run: python -m pip install -r validation/requirements.txt
      - run: python -m unittest discover -s validation -p 'test_*.py'
      - run: python -O -m unittest discover -s validation -p 'test_*.py'
      - run: python validation/validate.py
      - run: julia --project=. benchmark/run.jl
      - run: python validation/update_reports.py
      - name: Commit updated validation and benchmark reports
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/latest-results.json validation/REPORT.md benchmark/baseline.md README.md benchmark/comparison.md benchmark/real-world-baseline.md docs/validation.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): update validation and benchmark reports [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: opencv-reference-results
          path: validation/latest-results.json
