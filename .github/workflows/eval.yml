name: Evaluation & Benchmarks
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'
permissions:
  contents: write
concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 50
      - name: Check for recent commits
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RECENT=$(git log --since="7 days ago" --invert-grep --grep="\[skip ci\]" --oneline)
          LAST_MSG=$(git log -1 --pretty=%B)
          if [ -n "$RECENT" ] && ! echo "$LAST_MSG" | grep -q "\[skip ci\]"; then
            echo "Found recent commits in the past 7 days; running evaluation."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new non-bot commits in the past 7 days; skipping scheduled run."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: julia-actions/setup-julia@v3
        if: steps.check.outputs.should_run == 'true'
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3
        if: steps.check.outputs.should_run == 'true'
      - name: Cache Oxford validation dataset
        uses: actions/cache@v6
        if: steps.check.outputs.should_run == 'true'
        with:
          path: validation-data
          key: oxford-data-${{ hashFiles('validation/oxford-sources.toml') }}
      - if: steps.check.outputs.should_run == 'true'
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run Julia test suite (1 thread and auto threads)
        if: steps.check.outputs.should_run == 'true'
        run: |
          julia --startup-file=no --project=. --check-bounds=yes -t 1 -e 'using Pkg; Pkg.test()'
          julia --startup-file=no --project=. --check-bounds=yes -t auto -e 'using Pkg; Pkg.test()'
      - name: Run synthetic Julia SIFT baseline benchmark
        if: steps.check.outputs.should_run == 'true'
        run: julia --startup-file=no --project=. -t 1 benchmark/run.jl
      - name: Run pure-Julia Oxford 48-photo ground-truth evaluation & benchmark
        if: steps.check.outputs.should_run == 'true'
        run: |
          julia --startup-file=no --project=. -t 1 validation/eval_pure.jl \
            --oxford validation-data --download --compare-rootsift --benchmark \
            --write-report validation/REPORT.md
      - name: Commit updated evaluation and benchmark reports
        if: steps.check.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/REPORT.md benchmark/baseline.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): update pure-Julia evaluation and benchmark reports [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - uses: actions/upload-artifact@v7
        if: always() && steps.check.outputs.should_run == 'true'
        with:
          name: evaluation-results
          path: |
            validation/REPORT.md
            benchmark/baseline.md
