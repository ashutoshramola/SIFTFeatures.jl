name: Real photographs
on: workflow_dispatch
permissions:
  contents: write
jobs:
  oxford:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: julia-actions/cache@v3
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - run: python -m pip install -r validation/requirements.txt
      - run: python -m unittest discover -s validation -p 'test_*.py'
      - run: python -O -m unittest discover -s validation -p 'test_*.py'
      - run: python validation/validate.py
      - run: julia --project=. benchmark/run.jl
      - run: python validation/download_oxford.py --data-dir validation-data
      - run: python -O validation/real_world.py --data-dir validation-data --work-dir validation-work --max-side 0
      - run: python benchmark/compare.py --data-dir validation-data --samples 5 --warmups 1
      - run: python validation/update_reports.py
      - name: Commit updated validation and benchmark reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/validation.md validation/REPORT.md validation/latest-results.json validation/real-world-results.json benchmark/baseline.md benchmark/comparison.md benchmark/comparison-results.json benchmark/real-world-baseline.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): update real-world validation and comparative benchmarks [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: real-photograph-results
          path: |
            validation/real-world-results.json
            benchmark/comparison-results.json
