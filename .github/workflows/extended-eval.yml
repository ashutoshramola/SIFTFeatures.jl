name: Extended Evaluation & HPatches (Manual)
on:
  workflow_dispatch:
    inputs:
      run_oxford:
        description: 'Run Oxford 48-photo SIFT vs RootSIFT evaluation and timing benchmark'
        type: boolean
        default: true
      run_hpatches:
        description: 'Download and run HPatches (116 scenes, 696 photos, 580 pairs)'
        type: boolean
        default: false
      hpatches_max_side:
        description: 'HPatches max image side in px (800 default, 0 for full resolution)'
        type: string
        default: '800'
      julia_version:
        description: 'Julia version to evaluate'
        type: string
        default: '1.13'
permissions:
  contents: read
concurrency:
  group: extended-eval-${{ github.ref }}
  cancel-in-progress: false
jobs:
  extended-evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ inputs.julia_version }}
      - uses: julia-actions/cache@v3
      - name: Cache Oxford validation dataset
        if: inputs.run_oxford
        uses: actions/cache@v6
        with:
          path: validation-data
          key: oxford-data-${{ hashFiles('validation/oxford-sources.toml') }}
      - name: Cache HPatches dataset
        if: inputs.run_hpatches
        uses: actions/cache@v6
        with:
          path: hpatches-data
          key: hpatches-release-v1
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run pure-Julia extended evaluation
        run: |
          ARGS="--download --compare-rootsift"
          if [ "${{ inputs.run_oxford }}" = "true" ]; then
            ARGS="$ARGS --oxford validation-data --benchmark"
          fi
          if [ "${{ inputs.run_hpatches }}" = "true" ]; then
            ARGS="$ARGS --hpatches hpatches-data --hpatches-max-side ${{ inputs.hpatches_max_side }}"
          fi
          if [ "${{ inputs.run_oxford }}" != "true" ] && [ "${{ inputs.run_hpatches }}" != "true" ]; then
            echo "Enable at least one of run_oxford or run_hpatches."
            exit 1
          fi
          julia --startup-file=no --project=. -t auto validation/eval_pure.jl \
            $ARGS --write-report extended-eval-work/extended-report.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: extended-evaluation-report
          path: extended-eval-work/extended-report.md
